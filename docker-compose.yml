# Velociportal — example Docker Compose deployment.
#
# 1. Copy .env.example to .env and fill in the required values.
# 2. Run: docker compose up --detach --wait --build
#
# Velociportal is a visibility layer, not an auth layer. Keep it behind your
# trusted reverse proxy (the one that injects the Tailscale identity headers)
# and never expose it directly on the LAN.

services:
  velociportal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        GIT_REVISION: ${GIT_REVISION:-unknown}
        GIT_SOURCE_STATE: ${GIT_SOURCE_STATE:-unknown}
    image: ${IMAGE:-velociportal:latest}
    container_name: velociportal
    restart: unless-stopped

    # Raw mode prevents Compose from interpolating $, ${...}, quotes, or
    # backslashes before Velociportal applies its strict env-value grammar.
    env_file:
      - path: ${ENV_FILE:-.env}
        format: raw

    environment:
      # Decode and validate file values after Docker injects them literally.
      VELOCIPORTAL_ENV_FILE_ENCODING: go-quoted-v1
      # The process must listen on the container interface. The published host
      # port below remains loopback-only.
      LISTEN_ADDR: 0.0.0.0:8080

    ports:
      # host IP:host port:container port — keep the host binding loopback-only.
      - "127.0.0.1:8080:8080"

    # FROM scratch image: no writable dirs are needed at runtime.
    read_only: true

    # Drop all privileges — the process runs as uid 65534 (nobody).
    security_opt:
      - no-new-privileges:true

  # One-off setup, observer, and doctor commands use this profile so they share
  # the exact Compose network without loading the runtime service's env_file.
  velociportal-tools:
    profiles: ["tools"]
    image: ${IMAGE:-velociportal:latest}
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"

networks:
  default:
    # Keep the host-side bridge gateway stable across down/up cycles so an exact
    # observed TRUSTED_PROXY_CIDR remains valid. Override both values only when
    # this subnet conflicts with an existing local route.
    ipam:
      config:
        - subnet: ${VELOCIPORTAL_SUBNET:-172.31.255.0/24}
          gateway: ${VELOCIPORTAL_GATEWAY:-172.31.255.1}
