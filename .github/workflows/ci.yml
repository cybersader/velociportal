name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels the older run immediately, including any in-progress docs
# deployment, instead of waiting for the newer CI run to finish first.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.12'
      # Same targets as the first stages of `make check` (see CONTRIBUTING.md).
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: go test
        run: make test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.12'
      - name: Build binary and CLI smoke check
        run: make cli-smoke BUILD_VERSION=ci GIT_REVISION="${GITHUB_SHA}" GIT_SOURCE_STATE=clean
      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: velociportal
          path: velociportal

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose configuration
        run: make compose-check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image (verify only, no push) and smoke check
        run: make image-check IMAGE=velociportal:test BUILD_VERSION=ci GIT_REVISION="${GITHUB_SHA}" GIT_SOURCE_STATE=clean

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: pip install --requirement docs/requirements.txt
      - name: Build documentation strictly
        run: make docs-check

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, docker, docs]
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
