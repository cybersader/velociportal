name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels the older run immediately, including any in-progress docs
# deployment, instead of waiting for the newer CI run to finish first.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.12'
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -v -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.12'
      - name: Build binary
        run: >-
          CGO_ENABLED=0 go build
          -ldflags="-s -w -X main.buildVersion=ci -X main.buildRevision=${GITHUB_SHA} -X main.buildSourceState=clean"
          -o velociportal .
      - name: CLI smoke check
        run: |
          ./velociportal healthcheck --help >/dev/null
          ./velociportal validate --help >/dev/null
      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: velociportal
          path: velociportal

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose configuration
        run: ENV_FILE=.env.example docker compose --profile tools config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image (verify only, no push)
        run: |
          docker build \
            --build-arg BUILD_VERSION=ci \
            --build-arg GIT_REVISION="${GITHUB_SHA}" \
            --build-arg GIT_SOURCE_STATE=clean \
            -t velociportal:test .
      - name: Image smoke check
        run: |
          docker run --rm --read-only --security-opt no-new-privileges \
            velociportal:test healthcheck --help >/dev/null
          test "$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' velociportal:test)" = \
            '["CMD","/velociportal","healthcheck"]'
          test "$(docker image inspect --format '{{.Config.User}}' velociportal:test)" = '65534:65534'

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: pip install --requirement docs/requirements.txt
      - name: Build documentation strictly
        run: mkdocs build --strict

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, docker, docs]
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
