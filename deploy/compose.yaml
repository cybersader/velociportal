name: velociportal-production

# Production deployment bundle for TrueNAS Custom App, Dockge, Dokploy, and
# ordinary Docker Compose. This stack pulls a published image and runs exactly
# one container. It never builds source on the deployment host. Docker Engine
# 28+ is required for the loopback publication to remain unreachable from the
# same L2 network segment.
services:
  velociportal:
    image: ${VELOCIPORTAL_IMAGE:?set VELOCIPORTAL_IMAGE to an immutable published tag or digest}
    pull_policy: always
    restart: unless-stopped
    user: "65534:65534"

    # Raw mode preserves quotes, dollar signs, and backslashes until
    # Velociportal applies its strict go-quoted-v1 decoder.
    env_file:
      - path: ${VELOCIPORTAL_ENV_FILE:-./velociportal.env}
        format: raw

    environment:
      VELOCIPORTAL_ENV_FILE_ENCODING: go-quoted-v1
      LISTEN_ADDR: 0.0.0.0:8080
      TRUSTED_PROXY_CIDR: ${VELOCIPORTAL_TRUSTED_PROXY_CIDR:?set the exact trusted proxy CIDR, normally the configured bridge gateway /32}

    ports:
      # Keep the raw app reachable only from the Docker host. Tailscale Serve
      # reaches this socket from the TrueNAS host network namespace.
      - "127.0.0.1:18080:8080"

    # The fixed default bridge carries host-loopback ingress. The stable,
    # internal upstream network carries only direct Headscale and NPM API calls.
    networks:
      default: {}
      upstreams: {}

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

    healthcheck:
      test: ["CMD", "/velociportal", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

networks:
  default:
    ipam:
      config:
        - subnet: ${VELOCIPORTAL_SUBNET:-172.31.255.0/24}
          gateway: ${VELOCIPORTAL_GATEWAY:-172.31.255.1}
  upstreams:
    name: velociportal-upstreams
    internal: true
